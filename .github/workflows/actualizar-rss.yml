name: Actualizar RSS de Altia

on:
  workflow_dispatch:

  schedule:
    - cron: "19 * * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-altia-inversores
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Crear RSS
        run: python rss.py

      - name: Guardar RSS actualizada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all

          if git diff --cached --quiet; then
            echo "La RSS no tiene cambios."
            exit 0
          fi

          git commit -m "Actualizar RSS de Altia"
          git push
